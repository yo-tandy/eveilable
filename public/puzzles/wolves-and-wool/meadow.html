<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wolves &amp; Wool — the meadow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700;9..144,900&family=Karla:wght@400;600;700&family=Frank+Ruhl+Libre:wght@500;700;900&family=Heebo:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=14">
<link rel="stylesheet" href="css/meadow.css?v=14">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐑</text></svg>">
</head>
<body class="meadow-page">

<div class="room">
  <header class="topbar">
    <div class="brand">
      <h1 data-i18n-html="brand_html">Wolves <span class="amp">&amp;</span> Wool</h1>
      <p class="tagline" data-i18n="md_tagline">the pasture, alive</p>
    </div>
    <nav class="topnav">
      <select class="lang-select" id="langSelect" aria-label="Language">
        <option value="en">English</option>
        <option value="fr">Français</option>
        <option value="he">עברית</option>
      </select>
      <select class="lang-select" id="speedSelect" aria-label="Speed">
        <option value="0.7">🐢</option>
        <option value="1">🚶</option>
        <option value="1.4">🐇</option>
      </select>
      <button class="btn btn-ghost btn-icon" id="btnMute" title="Sound on/off">🔊</button>
      <button class="btn btn-ghost" id="btnHelp" data-i18n="nav_help">How to play</button>
      <button class="btn btn-ghost" id="btnLevels" data-i18n="nav_levels">Levels</button>
      <a class="btn btn-brass" href="index.html" data-i18n="to_classic">Classic board</a>
    </nav>
  </header>

  <main class="scene" id="scene">
    <div class="tilt mtilt" id="tilt">
      <div class="table" id="table"></div>
      <div class="mworld" id="mworld">
        <div class="mground" id="mground"></div>
        <div class="mpieces" id="mpieces"></div>
      </div>
    </div>
  </main>

  <footer class="controls">
    <button class="turnbtn turnbtn-left" id="btnTurnLeft" title="←">
      <svg viewBox="0 0 48 48"><path d="M24 8 A16 16 0 1 0 39.4 19.5" fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round"/><path d="M44 10 L38.5 21.5 L27 16.5 Z" fill="currentColor"/></svg>
      <span data-i18n="turn_left">Turn left</span>
    </button>
    <div class="hud">
      <div class="hud-level" id="hudLevel">Open Meadow</div>
      <div class="hud-moves"><span data-i18n="md_time">time</span> <span id="hudTime">0.0s</span><span id="hudBest" class="hud-best"></span></div>
      <div class="hud-btns">
        <button class="btn btn-ghost btn-small" id="btnPause">Pause</button>
        <button class="btn btn-ghost btn-small" id="btnReset" data-i18n="reset">Reset board</button>
      </div>
    </div>
    <button class="turnbtn turnbtn-right" id="btnTurnRight" title="→">
      <svg viewBox="0 0 48 48"><path d="M24 8 A16 16 0 1 1 8.6 19.5" fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round"/><path d="M4 10 L9.5 21.5 L21 16.5 Z" fill="currentColor"/></svg>
      <span data-i18n="turn_right">Turn right</span>
    </button>
  </footer>

  <div class="overlay" id="startOverlay" hidden>
    <div class="card">
      <div class="card-kicker" id="startLevelName"></div>
      <h2 data-i18n="md_start">Begin the day</h2>
      <p data-i18n="md_hint">Hold to steer — every animal turns together.</p>
      <div class="card-actions">
        <button class="btn btn-brass" id="btnStart" data-i18n="md_start">Begin the day</button>
      </div>
    </div>
  </div>

  <div class="overlay" id="overlay" hidden>
    <div class="card">
      <div class="card-kicker" id="overlayKicker"></div>
      <h2 id="overlayTitle"></h2>
      <p id="overlayBody"></p>
      <div class="card-actions" id="overlayActions"></div>
    </div>
  </div>

  <div class="overlay" id="levelsModal" hidden>
    <div class="card card-wide">
      <button class="card-close" data-close aria-label="Close">×</button>
      <h2 data-i18n="cabinet_title">The Level Cabinet</h2>
      <div class="level-list" id="meadowList"></div>
    </div>
  </div>

  <div class="overlay" id="helpModal" hidden>
    <div class="card card-wide">
      <button class="card-close" data-close aria-label="Close">×</button>
      <h2 data-i18n="help_title">How to play</h2>
      <div class="help-body" data-i18n-html="md_help_html"></div>
    </div>
  </div>
</div>

<script src="js/i18n.js?v=14"></script>
<script src="js/audio.js?v=14"></script>
<script src="js/meadow-sim.js?v=14"></script>
<script src="js/meadow-levels.js?v=14"></script>
<script src="js/meadow-app.js?v=14"></script>
</body>
</html>
